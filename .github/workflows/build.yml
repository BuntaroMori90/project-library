name: Quality and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      NEON_AUTH_BASE_URL: https://example.com/project_library/auth
      NEON_AUTH_COOKIE_SECRET: build-only-cookie-secret-12345678901234567890
      CATALOG_USER_AGENT: ProjectLibrary-CI/0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint and typecheck
        run: npm run check
      - name: Test manga cover recovery
        run: node tests/manga-cover-recovery.cjs
      - name: Test consecutive variant saves
        run: node tests/repeat-variant-save.cjs
      - name: Build Next.js application
        run: npm run build
